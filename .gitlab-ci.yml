# CI of the main repository: tests on the lowest supported Node and on current releases, then the
# package checks (publint, attw, tarball). A tag's pipeline only packs: the tagged commit was tested when it was pushed.
# Having this file also turns Auto DevOps off for the project.

stages: [test, package]

default:
  image: node:24
  # a runner with the tag `heavy` has the cores and memory the full suites need; the instance's shared runner has not
  tags: [heavy]
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

test:
  stage: test
  image: node:$NODE
  # a newer push of the branch makes the running tests redundant
  interruptible: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  parallel:
    matrix:
      - NODE: ['20.19.0', '22', '24', '26']
  script:
    - node --version
    - npm run typecheck
    # the container's CPU limit is not what Node sees as the machine's cores: five workers, not one per core
    - npm test -- --maxWorkers=5
    - npm run test:dist -- --maxWorkers=5

package:
  stage: package
  script:
    - npm run check:package
    - mkdir -p release
    - npm pack --pack-destination release
    - ls -l release
  artifacts:
    paths: [release/*.tgz]
    expire_in: 1 week
