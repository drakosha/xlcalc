# CI of the main repository: tests on the lowest supported Node and on current releases, then the
# package checks (publint, attw, tarball). Having this file also turns Auto DevOps off for the project.

stages: [test, package]

default:
  image: node:24
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

test:
  stage: test
  image: node:$NODE
  parallel:
    matrix:
      - NODE: ['20.13.0', '22', '24', '26']
  script:
    - node --version
    - npm run typecheck
    - npm test
    - npm run test:dist

package:
  stage: package
  script:
    - npm run check:package
    - mkdir -p release
    - npm pack --pack-destination release
    - ls -l release
  artifacts:
    paths: [release/*.tgz]
    expire_in: 1 week
